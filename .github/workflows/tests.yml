name: tests

# Python lint/tests on Linux and the TypeScript runtime on all supported hosts.
# The TypeScript job also checks the existing frontend contract consumers.
#
# Everything else -- the mypy type gate, the platform-portability, frontend
# and Windows desktop-package checks -- live in extended.yml and run only on
# demand (workflow_dispatch): before a release, or when a change touches the
# chat bridges, the pairing/QR path, the cockpits or the Tauri host.

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: linux · lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.12.0'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        # The project's own dev extra, rather than a hand-listed subset that
        # drifts. The community verticals (argus-verticals) and their heavy
        # scientific stack are not installed here: this suite tests the
        # framework and its seven built-in verticals only.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,qr,trial]'
      - name: Lint
        run: python -m ruff check argus argus_skill tests
      - name: Build Node packages for Python integration tests
        run: |
          npm ci
          npm run build
      - name: Test
        run: python -m pytest -q -n auto

  typescript:
    name: typescript · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.12.0'
          cache: npm
      - run: npm ci
      - run: npm run check
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: runner.os != 'Linux'
        with:
          python-version: '3.11'
      - name: Verify budget ownership on macOS and Windows
        if: runner.os != 'Linux'
        run: |
          python -m pip install -e '.[dev]'
          python -m pytest tests/core/test_budget_bridge.py tests/core/test_typescript_budgeted_pi.py tests/core/test_typescript_process_ownership.py tests/core/test_process_guard.py tests/core/test_accounting_integrity.py -o addopts='' -q
      - name: Check existing frontend consumers
        if: runner.os == 'Linux'
        run: |
          npm --prefix frontend/web ci
          npm --prefix frontend/web run typecheck
          npm --prefix frontend/tui ci
          npm --prefix frontend/tui run typecheck
          node --import tsx --test frontend/tui/test/protocol.test.ts
