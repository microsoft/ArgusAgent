appId: cn.argusbot.desktop
productName: Argus
directories:
  output: release
  buildResources: resources
files:
  - out/**
extraResources:
  - from: build/argus-backend
    to: argus-backend
  - from: resources/icon.ico
    to: icon.ico
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  icon: resources/icon.ico
nsis:
  include: resources/installer.nsh
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  runAfterFinish: true
  createDesktopShortcut: true
  shortcutName: Argus
  artifactName: Argus-${version}-setup.${ext}
portable:
  artifactName: Argus-${version}-portable.${ext}
publish:
  provider: github
  owner: lbx154
  repo: Argus
